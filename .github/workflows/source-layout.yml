name: Source layout

on:
  push:
    branches: [unstable]
  pull_request:
    branches: [unstable]

permissions:
  contents: read

jobs:
  documentation-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate documentation layout and links
        run: python -m unittest discover -s tests -p 'test_documentation_layout.py' -v
