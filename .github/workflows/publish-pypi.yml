name: Publish Zog to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type recover-v0.1.0 to reuse the retained canonical artifacts"
        required: true
        type: string

jobs:
  build:
    if: github.event_name == 'push'
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}; expected {expected!r}")
          print(f"Publishing Zog {version} from {tag}")
          PY

      - name: Install release build tools
        run: python -m pip install --upgrade build twine

      - name: Build canonical sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Clean-install and resolve aggregate interfaces
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python - <<'PY'
          import importlib
          import importlib.metadata

          modules = [
              "zog.archive_mirror",
              "zog.box_control",
              "zog.build_record",
              "zog.build_trace",
              "zog.host_deploy",
              "zog.host_discover",
              "zog.host_identify",
              "zog.host_install",
              "zog.image_build",
              "zog.integrate_observe",
              "zog.network_register",
              "zog.root_control",
              "zog.station_access",
              "zog.version_share",
          ]
          for name in modules:
              importlib.import_module(name)

          distribution = importlib.metadata.distribution("zog")
          if distribution.version != "0.1.0":
              raise SystemExit(f"unexpected distribution version: {distribution.version}")

          expected_scripts = {
              "archive-mirror",
              "box-control",
              "build-record",
              "build-trace",
              "host-deploy",
              "host-deploy-systemd",
              "host-discover",
              "host-discover-recovery",
              "host-discover-supervisor",
              "host-install",
              "image-build",
              "integrate-observe",
              "network-register",
              "root-control",
              "station-access",
              "version-share",
          }
          scripts = {
              entry.name: entry
              for entry in distribution.entry_points
              if entry.group == "console_scripts"
          }
          if set(scripts) != expected_scripts:
              raise SystemExit(
                  f"console script set differs: expected {sorted(expected_scripts)}, got {sorted(scripts)}"
              )
          for name in sorted(expected_scripts):
              scripts[name].load()

          internal = {
              "archive-mirror", "box-control", "build-record", "build-trace",
              "host-deploy", "host-discover", "host-identify", "host-install",
              "image-build", "integrate-observe", "network-register",
              "root-control", "station-access", "version-share",
          }
          requirements = distribution.requires or []
          normalized = {
              req.split(";", 1)[0].strip().split("[", 1)[0]
                 .split(" ", 1)[0].split("=", 1)[0]
                 .split("<", 1)[0].split(">", 1)[0].lower().replace("_", "-")
              for req in requirements
          }
          leaked = sorted(internal & normalized)
          if leaked:
              raise SystemExit(f"internal Zog components leaked into Requires-Dist: {leaked}")

          import zog
          if zog.__version__ != "0.1.0":
              raise SystemExit(f"unexpected zog.__version__: {zog.__version__}")
          print("14 imports and 16 console entry points resolved")
          PY
          .release-venv/bin/python -m pip check

      - name: Record canonical artifact hashes
        shell: bash
        run: |
          sha256sum dist/* | tee SHA256SUMS

      - name: Retain canonical distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 90

  stage-github-release:
    name: Stage draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download canonical distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Compute release hashes
        run: sha256sum dist/* | tee SHA256SUMS

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          title="Zog ${tag#v}"
          notes="Canonical Zog ${tag#v} release artifacts. The attached zog-${tag#v}.tar.gz is the canonical Python source distribution; GitHub-generated source snapshots are repository snapshots and are not substitutes for the sdist."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$title" \
              --notes "$notes"
          fi

  publish-to-pypi:
    name: Publish exact artifacts to PyPI
    needs: stage-github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zog
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download canonical distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  finalize-github-release:
    name: Publish GitHub release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish staged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false


  recover-v0-1-0-artifacts:
    name: Recover retained v0.1.0 artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'recover-v0.1.0'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download retained canonical distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "37991473486"

      - name: Verify tag, source identity and artifact hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0"
          expected_commit="7a42f06eb9b2dd2d235d13190a68b872069a450e"
          expected_wheel="0971afeaa8653842d60557fbd82f2aef7d673c0fb0289b8cac9fe4603128b69a"
          expected_sdist="312891a414208de3936f94a3f0e36aef439aaaef50d67b12a18437f2b1886b54"

          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          actual_type="$(jq -r '.object.type' <<<"${ref_json}")"
          actual_commit="$(jq -r '.object.sha' <<<"${ref_json}")"

          test "${actual_type}" = "commit"
          test "${actual_commit}" = "${expected_commit}"
          test "$(sha256sum dist/zog-0.1.0-py3-none-any.whl | awk '{print $1}')" = "${expected_wheel}"
          test "$(sha256sum dist/zog-0.1.0.tar.gz | awk '{print $1}')" = "${expected_sdist}"

          printf '%s  %s\n' "${expected_wheel}" "dist/zog-0.1.0-py3-none-any.whl" > SHA256SUMS
          printf '%s  %s\n' "${expected_sdist}" "dist/zog-0.1.0.tar.gz" >> SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain recovered distributions for this run
        uses: actions/upload-artifact@v6
        with:
          name: recovered-python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 90

  recover-v0-1-0-stage-github-release:
    name: Stage recovered v0.1.0 draft GitHub release
    needs: recover-v0-1-0-artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download retained canonical distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "37991473486"

      - name: Verify canonical hashes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "0971afeaa8653842d60557fbd82f2aef7d673c0fb0289b8cac9fe4603128b69a" "dist/zog-0.1.0-py3-none-any.whl" > SHA256SUMS
          printf '%s  %s\n' "312891a414208de3936f94a3f0e36aef439aaaef50d67b12a18437f2b1886b54" "dist/zog-0.1.0.tar.gz" >> SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0"
          title="Zog 0.1.0"
          notes="Canonical Zog 0.1.0 release artifacts recovered from original workflow run 37991473486. The attached zog-0.1.0.tar.gz is the canonical Python source distribution; GitHub-generated source snapshots are repository snapshots and are not substitutes for the sdist."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$title" \
              --notes "$notes"
          fi

  recover-v0-1-0-publish-to-pypi:
    name: Publish recovered exact v0.1.0 artifacts to PyPI
    needs: recover-v0-1-0-stage-github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zog
    permissions:
      actions: read
      id-token: write
      contents: read

    steps:
      - name: Download retained canonical distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "37991473486"

      - name: Verify canonical hashes before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum dist/zog-0.1.0-py3-none-any.whl | awk '{print $1}')" = "0971afeaa8653842d60557fbd82f2aef7d673c0fb0289b8cac9fe4603128b69a"
          test "$(sha256sum dist/zog-0.1.0.tar.gz | awk '{print $1}')" = "312891a414208de3936f94a3f0e36aef439aaaef50d67b12a18437f2b1886b54"

      - name: Publish distributions using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  recover-v0-1-0-finalize-github-release:
    name: Publish recovered v0.1.0 GitHub release
    needs: recover-v0-1-0-publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish staged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v0.1.0" --repo "${GITHUB_REPOSITORY}" --draft=false
