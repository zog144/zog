[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "zog"
version = "0.1.0"
description = "Zog aggregate Python distribution"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause OR GPL-3.0-only"
license-files = ["LICENSES/*"]
dependencies = ["Django>=5.2,<5.3", "PyJWT>=2.10,<3", "boto3>=1.34,<2", "cryptography>=44", "dbus-next==0.2.3", "dnspython>=2.8,<3", "http-message-signatures>=2.0.1,<3", "requests>=2.32,<3", "typing_extensions>=4.12", "waitress>=3,<4"]

[project.urls]
Source = "https://github.com/zog144/zog"

[project.scripts]
archive-mirror = "zog.archive_mirror.cli:main"
box-control = "zog.box_control.cli:main"
build-record = "zog.build_record.cli:main"
build-trace = "zog.build_trace.cli:main"
host-deploy = "zog.host_deploy.cli:main"
host-deploy-systemd = "zog.host_deploy.runner:main"
host-discover = "zog.host_discover.daemon:main"
host-discover-recovery = "zog.host_discover.recovery:main"
host-discover-supervisor = "zog.host_discover.supervisor:main"
host-install = "zog.host_install.cli:main"
image-build = "zog.image_build.__main__:main"
integrate-observe = "zog.integrate_observe.cli:main"
network-register = "zog.network_register.cli:main"
root-control = "zog.root_control.daemon:main"
station-access = "zog.station_access.cli:main"
version-share = "zog.version_share.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["zog*"]
namespaces = true

[tool.setuptools.package-data]
"zog" = ["_release_manifest.json"]
"zog.host_deploy" = ["beacon_sources.json", "beacon_installation/*"]
"zog.host_discover" = ["systemd/*"]
"zog.host_install" = ["systemd/*"]
"zog.root_control" = ["native/*.c"]
"zog.station_access" = ["host_registry/fixtures/*.json"]
